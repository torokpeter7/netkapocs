<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fejlesztés alatt</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 700px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.3rem;
      opacity: 0.9;
    }

    .date {
      margin-top: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }

      p,
      .date {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚧 Weboldal fejlesztés alatt 🚧</h1>
    <p>Köszönjük a türelmed!</p>
    <div class="date">
      Várható megjelenés: 2026.05.28
    </div>
  </div>
</body>
</html>
